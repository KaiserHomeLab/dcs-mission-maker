# Push a tag like v1.2.0 (matching __version__ in app/__init__.py) to publish a GitHub release
# with the Windows installer and zip. The Windows app's update check looks for these releases.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      release: true

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "DCS Mission Maker ${GITHUB_REF_NAME#v}" --generate-notes
